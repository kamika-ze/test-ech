name: ECH + Provider Domain Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which stage to run"
        required: true
        type: choice
        options:
          - provider
          - ech
        default: provider
      input_file:
        description: "Path (in this repo) to the input file"
        required: true
        default: "input_domains.txt"
      output_file:
        description: "Path (in this repo) to write the output file"
        required: true
        default: "with_provider.csv"
      format:
        description: "Output format"
        required: true
        type: choice
        options:
          - csv
          - txt
        default: csv
      top_n:
        description: "Only process the first N domains (leave empty for all)"
        required: false
        default: ""
      workers:
        description: "Concurrent worker threads"
        required: false
        default: "80"

jobs:
  run-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub Actions max for a single job

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dig (dnsutils)
        run: sudo apt-get update && sudo apt-get install -y dnsutils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ECH/Provider checker
        run: |
          ARGS="--${{ inputs.mode }} -i ${{ inputs.input_file }} -o ${{ inputs.output_file }} -f ${{ inputs.format }} -w ${{ inputs.workers }}"
          if [ -n "${{ inputs.top_n }}" ]; then
            ARGS="$ARGS -n ${{ inputs.top_n }}"
          fi
          python3 ech_provider_checker.py $ARGS

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.mode }}
          path: ${{ inputs.output_file }}
          retention-days: 14
